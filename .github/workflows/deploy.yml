name: Build & Publish Production Branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build React & Push to Production Branch
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Source Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build Production Bundle
        run: npm run build

      - name: 🚀 Deploy Built dist to 'production' branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: production
          folder: dist
          clean: true
